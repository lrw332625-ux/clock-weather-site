<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clock Weather 支持</title><style>body{font:16px/1.75 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#17212b;background:#f7f9fb;margin:0}main{max-width:720px;margin:auto;padding:42px 24px}a{color:#1767a4}section{background:white;border:1px solid #e1e7ed;border-radius:22px;padding:14px 28px}</style></head><body><main><p><a href="index.html">← Clock Weather</a></p><section><h1>Clock Weather 支持</h1><p>长按 iPhone 主屏幕空白处，选择添加小组件，搜索“Clock Weather”。天气主题目前显示上海天气、摄氏温度和美标 AQI。无网络时数据可能显示“--”。</p><p>秒数由 iOS 更新，小组件刷新可能受省电、低亮度等系统状态影响。若你遇到问题，请在 <a href="https://github.com/lrw332625-ux/clock-weather-site/issues">支持页面提交问题</a>，并说明 iOS 版本、设备型号和主题名称。请勿上传密码或个人敏感信息。</p><p>公开支持邮箱：<a href="mailto:homecls@gmail.com">homecls@gmail.com</a></p><p><a href="privacy.html">隐私政策</a></p></section></main></body></html>
